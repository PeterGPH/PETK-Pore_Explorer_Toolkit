[pytest]
# Only collect the unit tests. Scripts under sem/scripts/ such as
# grid_convergence_test.py match pytest's default *_test.py pattern but are
# DOLFINx benchmarks, not tests (see CONTRIBUTING.md).
testpaths = tests
# Make `import sem` work from a plain checkout; CI runs `pytest` without
# pip-installing the package.
pythonpath = .
